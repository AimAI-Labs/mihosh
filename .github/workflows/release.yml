name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build native update fixture
        run: go build -o "$RUNNER_TEMP/mihosh" .

      - name: Test Linux
        if: runner.os == 'Linux'
        run: MIHOSH_UPDATE_TEST_BINARY="$RUNNER_TEMP/mihosh" go test ./...

      # Managed core runtime coverage runs on Linux. Exercise the portable
      # client, updater and configuration paths on macOS itself.
      - name: Test macOS
        if: runner.os == 'macOS'
        run: |
          export MIHOSH_UPDATE_TEST_BINARY="$RUNNER_TEMP/mihosh"
          go test ./internal ./internal/bootstrap ./internal/infrastructure/{api,config,profile,sync} ./internal/ui/tui/features/logs ./pkg/...
          go test ./internal/app/service -run 'Test(UpdateSelectsExactVerifiedReleaseAsset|ApplyReleaseUpdate|RestoreBundle|SyncService|ProfileServiceRetries|ActivateRemote|ActivateRefreshesChangedSource|ActivateLoadsChangedLocalSource|BatchStopsClaiming|OversizedRemoteSubscription|MacOSManagedEntryPoints)'
          go test ./internal/infrastructure/host -run '^TestGracefulCancelSendsSIGTERM$'
          go test ./internal/cli -run '^TestSyncCLI'
          go test ./internal/ui/tui -run 'Test(ActivationMetadataFailureNotice|TargetChangeInvalidates|SlowControllerDiscovery|QueuedWebSocketMessage|WebSocketLogBurst|WSInbox)'

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          # - goos: windows
          #   goarch: amd64
          # - goos: windows
          #   goarch: arm64

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          LDFLAGS="-s -w -X github.com/AimAI-Labs/mihosh/internal/domain/model.Version=${VERSION} -X github.com/AimAI-Labs/mihosh/internal/domain/model.Commit=${COMMIT} -X github.com/AimAI-Labs/mihosh/internal/domain/model.Date=${DATE}"
          if [ "$GOOS" = "windows" ]; then
            go build -ldflags="${LDFLAGS}" -o mihosh.exe .
          else
            go build -ldflags="${LDFLAGS}" -o mihosh .
          fi

      - name: Package
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip mihosh-${{ matrix.goos }}-${{ matrix.goarch }}.zip mihosh.exe
          else
            tar -czvf mihosh-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz mihosh
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mihosh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mihosh-*.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Determine release channel
        id: channel
        shell: bash
        run: |
          version="${GITHUB_REF_NAME%%+*}"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            if ! git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
              echo "::error::Stable release tags must point to commits on main."
              exit 1
            fi
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mihosh-*.tar.gz
            mihosh-*.zip
          generate_release_notes: true
          prerelease: ${{ steps.channel.outputs.prerelease }}

      - name: Update Homebrew formula
        if: steps.channel.outputs.prerelease == 'false'
        env:
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p Formula

          darwin_amd64_sha="$(sha256sum mihosh-darwin-amd64.tar.gz | awk '{print $1}')"
          darwin_arm64_sha="$(sha256sum mihosh-darwin-arm64.tar.gz | awk '{print $1}')"
          linux_amd64_sha="$(sha256sum mihosh-linux-amd64.tar.gz | awk '{print $1}')"
          linux_arm64_sha="$(sha256sum mihosh-linux-arm64.tar.gz | awk '{print $1}')"

          cat > Formula/mihosh.rb <<EOF
          class Mihosh < Formula
            desc "Terminal UI management tool for mihomo"
            homepage "https://github.com/${REPOSITORY}"
            version "${VERSION#v}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/${REPOSITORY}/releases/download/${VERSION}/mihosh-darwin-arm64.tar.gz"
                sha256 "${darwin_arm64_sha}"
              end

              on_intel do
                url "https://github.com/${REPOSITORY}/releases/download/${VERSION}/mihosh-darwin-amd64.tar.gz"
                sha256 "${darwin_amd64_sha}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/${REPOSITORY}/releases/download/${VERSION}/mihosh-linux-arm64.tar.gz"
                sha256 "${linux_arm64_sha}"
              end

              on_intel do
                url "https://github.com/${REPOSITORY}/releases/download/${VERSION}/mihosh-linux-amd64.tar.gz"
                sha256 "${linux_amd64_sha}"
              end
            end

            def install
              bin.install "mihosh"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/mihosh version")
            end
          end
          EOF

      - name: Push Homebrew formula
        if: steps.channel.outputs.prerelease == 'false'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Formula/mihosh.rb
          if git diff --cached --quiet -- Formula/mihosh.rb; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi

          git commit -m "Update mihosh to ${GITHUB_REF_NAME}"
          git push origin HEAD:main
